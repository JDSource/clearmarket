# Kalshi open-market snapshot — hourly, from a GitHub runner, because Kalshi rate-limits Cloudflare
# Workers' shared egress IPs at the first request (the Worker's own hourly Kalshi scan only got through
# sporadically; cron_runs made it visible 2026-09-17). Publishes kalshi-tracked-latest.json to R2; the
# Worker's refreshMarks() applies it to the tracked markets when its direct fetch fails or the snapshot
# is fresher. Dispatched by the Worker at :45 so the :00 cron finds a snapshot at most ~15 minutes old.
# No GitHub `schedule:` trigger: GitHub's scheduler fired 20 min to 10 h late, duplicating the dispatched run
# (double load on D1 and Kalshi, and most of the failure emails Sept-Nov 2026). Removed 2026-11-10.
#
# Manual: gh workflow run kalshi-marks.yml

name: Kalshi marks snapshot (hourly)

on:
  workflow_dispatch: {}   # dispatched by the Worker's :45 cron (api/src/index.ts dispatchWorkflow); no GitHub schedule, see header

permissions:
  contents: read

concurrency:
  group: kalshi-marks
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the tracked Kalshi markets (tickers= batches of 200)
        run: python3 scripts/fetch_kalshi_open.py kalshi-tracked-latest.json
      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.134.0 r2 object put cm-data/kalshi-tracked-latest.json --file=kalshi-tracked-latest.json --remote
