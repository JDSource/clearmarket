# Freshness — daily bundle-side status sweep.
#
# Closes the static-page staleness gap: the Worker's 06:00 UTC cron heals statuses in D1
# (API/MCP), but the event pages render from the R2 bundle, which previously only changed on
# monthly re-enrich ships — 3.5 weeks of drift left ~4,000 settled markets rendering as live
# (caught 2026-07-06). This job runs at 06:30 UTC: pull the served bundle from R2, venue-check
# every open-but-past-due market (scripts/sweep_past_due.py — zero LLM, status GETs only),
# rebuild the resolution log, push both back to R2. The existing 08:00 UTC cm-signal-daily
# rebuild then re-renders the site from the refreshed bundle. Net cadence:
#   price+volume hourly (Worker marks cron, D1) · statuses+resolution history daily (both
#   surfaces: 06:00 D1 cron + this job for the bundle) · grades on re-enrichment.
#
# Required repo secrets (same as cm-signal-daily.yml):
#   CM_DATA_BASE_URL — public R2 base URL for the data files
#   CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID — must include R2 Object Read & Write on the
#     cm-data bucket. If the R2 put fails with a permissions error, mint an R2-scoped token and
#     update the secret (the local .env token is known-under-scoped; don't copy that one).
#
# First run: use the manual "Run workflow" button and watch it before trusting the schedule.

name: Freshness — daily status sweep

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC — after the Worker's 06:00 D1 reconcile, before the 08:00 site rebuild
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: freshness-daily
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Fetch the served bundle + resolution log from R2
        env:
          BASE: ${{ secrets.CM_DATA_BASE_URL }}
        run: |
          mkdir -p web/data
          curl -fsSL "$BASE/universe-enriched-linked.json" -o web/data/universe-enriched-linked.json
          curl -fsSL "$BASE/resolution-log.json" -o web/data/resolution-log.json
          echo "bundle: $(du -h web/data/universe-enriched-linked.json | cut -f1)"

      - name: Sweep past-due open markets against their venues
        run: python3 scripts/sweep_past_due.py

      - name: Rebuild the resolution log from the reconciled statuses
        run: python3 build_resolution_log.py

      - name: Push refreshed bundle + log back to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put cm-data/universe-enriched-linked.json \
            --file=web/data/universe-enriched-linked.json --remote
          npx --yes wrangler@4 r2 object put cm-data/resolution-log.json \
            --file=web/data/resolution-log.json --remote
