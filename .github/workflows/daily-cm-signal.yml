# Daily CM Signal wire generation.
#
# DORMANT until activated post-launch. Prerequisites (all owner actions):
#   1. Repo pushed to GitHub (hold-the-push lifted).
#   2. The enriched bundle (web/data/universe-enriched-linked.json, ~48MB, gitignored)
#      hosted at a URL the runner can fetch — set repo secret BUNDLE_URL. Cheapest:
#      a Cloudflare R2 object or a GitHub Release asset. Re-upload only when the full
#      enrichment re-runs (infrequent); the daily Signal cycle just reads it.
#   3. Cloudflare Pages project "clearmarket" created (done at go-live).
#   4. Repo secrets set: ANTHROPIC_API_KEY, EXA_API_KEY, BUNDLE_URL,
#      CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#
# What it does: fetch bundle -> patch ladders -> generate wires (Exa + Claude) ->
# rebuild the static site -> deploy to Pages -> commit the new wire content back.
# It does NOT touch D1 (prices/catalysts are refreshed by the Worker's own cron;
# signals are static content files, not D1 rows).

name: daily-cm-signal

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC (~7am ET) — after the US overnight news settles
  workflow_dispatch: {} # manual run for testing

concurrency:
  group: daily-cm-signal
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit regenerated wires back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch enriched bundle
        env:
          BUNDLE_URL: ${{ secrets.BUNDLE_URL }}
        run: |
          test -n "$BUNDLE_URL" || { echo "BUNDLE_URL secret not set"; exit 1; }
          mkdir -p web/data
          curl -fsSL "$BUNDLE_URL" -o web/data/universe-enriched-linked.json
          echo "bundle: $(du -h web/data/universe-enriched-linked.json | cut -f1)"

      - name: Install Python deps
        run: pip install anthropic requests python-dotenv

      - name: Patch ladders + generate wires
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CM_API_BASE: https://api.clearmarket.fyi
        run: |
          python3 patch_ladders.py
          python3 gen_news_cycle.py --max 5

      - name: Build static site
        run: |
          cd web && npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd web && npx wrangler pages deploy dist --project-name clearmarket

      - name: Commit new wires
        run: |
          git config user.name "clearmarket-bot"
          git config user.email "bot@clearmarket.fyi"
          git add web/src/content/signals data/ladder-labels.json
          if git diff --cached --quiet; then
            echo "no new wires today"
          else
            git commit -m "chore: daily CM Signal wires ($(date -u +%Y-%m-%d))"
            git push
          fi
